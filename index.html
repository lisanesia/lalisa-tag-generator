let used = new Set();
let currentCaption = "";

const hashtags =
"#LISAxLVSS27 #LISAxLouisVuitton";

function randomItem(array){
  return array[Math.floor(Math.random() * array.length)];
}

function createCaption(){

  const event =
    document.getElementById("event").value.trim()
    || "Louis Vuitton Fashion Show";

  const name =
    document.getElementById("name").value.trim()
    || "LISA";

  const vibe =
    document.getElementById("vibe").value;

  const d = data[vibe];

  let caption;
  let attempts = 0;

  do{

    const opening =
      randomItem(d.open);

    const middle =
      randomItem(d.middle);

    const closing =
      randomItem(d.close);

    caption =
      opening
      .replaceAll("{name}",name)
      .replaceAll("{event}",event)
      + "\n\n"
      + middle
      + "\n\n"
      + closing;

    attempts++;

    /*
    Safety net:
    if every combination somehow gets used,
    reset the current pool.
    */
    if(attempts > 100){
      used.clear();
      break;
    }

  }while(used.has(caption));

  used.add(caption);

  return caption;
}

function generate(){

  currentCaption = createCaption();

  document.getElementById("caption").textContent =
    currentCaption;

  document.getElementById("result").style.display =
    "block";

  document.getElementById("counter").textContent =
    "CAPTION GENERATED • " + used.size + " USED";
}

function copyText(text){

  if(navigator.clipboard){

    navigator.clipboard.writeText(text)
    .then(()=>{
      alert("Berhasil dicopy! ✨");
    })
    .catch(()=>{
      fallback(text);
    });

  }else{
    fallback(text);
  }
}

function fallback(text){

  const area =
    document.createElement("textarea");

  area.value = text;

  document.body.appendChild(area);

  area.select();

  document.execCommand("copy");

  area.remove();

  alert("Berhasil dicopy! ✨");
}

function copyCaption(){
  copyText(currentCaption);
}

function copyTags(){
  copyText(hashtags);
}

function copyAll(){

  copyText(
    currentCaption
    + "\n\n"
    + hashtags
  );

}
