<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISA × LOUIS VUITTON — Caption Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#292929 0%,#111 38%,#050505 75%);
  color:#f5f5f5;
  padding:24px 16px 50px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
}

.header{
  text-align:center;
  padding:35px 10px 25px;
}

.eyebrow{
  font-size:12px;
  letter-spacing:4px;
  color:#bcbcbc;
  margin-bottom:14px;
}

h1{
  font-size:clamp(30px,7vw,58px);
  letter-spacing:2px;
  line-height:1;
  font-weight:800;
}

.subtitle{
  margin-top:14px;
  color:#aaa;
  font-size:14px;
  letter-spacing:1px;
}

.card{
  background:rgba(20,20,20,.92);
  border:1px solid #333;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

label{
  display:block;
  font-size:12px;
  letter-spacing:1.5px;
  color:#aaa;
  margin-bottom:8px;
  text-transform:uppercase;
}

input,select{
  width:100%;
  background:#0c0c0c;
  color:white;
  border:1px solid #383838;
  border-radius:12px;
  padding:14px 15px;
  font-size:15px;
  outline:none;
  margin-bottom:18px;
}

input:focus,select:focus{
  border-color:#aaa;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.generate{
  width:100%;
  background:#f2f2f2;
  color:#080808;
  padding:16px;
  font-size:15px;
  margin-top:4px;
}

.generate:hover{
  background:white;
}

.result{
  margin-top:22px;
  display:none;
}

.result-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.result-title h2{
  font-size:16px;
  letter-spacing:1px;
}

.copy{
  background:#242424;
  color:white;
  border:1px solid #444;
}

.caption-box{
  background:#090909;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  line-height:1.7;
  white-space:pre-line;
  color:#eee;
  font-size:15px;
}

.tags{
  margin-top:18px;
  background:#090909;
  border:1px solid #333;
  border-radius:15px;
  padding:18px;
  color:#d7d7d7;
  line-height:1.8;
  font-size:14px;
}

.tag{
  display:inline-block;
  margin:3px 4px 3px 0;
  color:#fff;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.actions button{
  flex:1;
}

.shuffle{
  background:#242424;
  color:#fff;
  border:1px solid #444;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#666;
  font-size:11px;
  letter-spacing:1px;
}

@media(max-width:600px){
  body{
    padding:12px 10px 35px;
  }

  .header{
    padding:28px 5px 20px;
  }

  .card{
    padding:18px;
    border-radius:18px;
  }

  .result-title{
    align-items:flex-start;
  }

  .copy{
    padding:10px 13px;
    font-size:12px;
  }

  .caption-box{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="eyebrow">FOR LILIES • FASHION EVENT</div>
    <h1>LISA × LV</h1>
    <p class="subtitle">FASHION SHOW CAPTION GENERATOR</p>
  </header>

  <main class="card">

    <label for="event">Fashion Event</label>
    <input
      id="event"
      type="text"
      value="Louis Vuitton Fashion Show"
      placeholder="Example: Paris Fashion Week"
    >

    <label for="keyword">Main Keyword</label>
    <input
      id="keyword"
      type="text"
      value="LISA"
      placeholder="Example: LISA"
    >

    <label for="tone">Caption Style</label>
    <select id="tone">
      <option value="glam">Glamorous</option>
      <option value="power">Powerful</option>
      <option value="elegant">Elegant</option>
      <option value="hype">Hype / Fan Support</option>
      <option value="short">Short & Clean</option>
    </select>

    <button class="generate" onclick="generateCaption()">
      ✨ GENERATE CAPTION
    </button>

    <section class="result" id="result">

      <div class="result-title">
        <h2>GENERATED CAPTION</h2>
        <button class="copy" onclick="copyCaption()">COPY</button>
      </div>

      <div class="caption-box" id="caption"></div>

      <div class="result-title" style="margin-top:22px;">
        <h2>HASHTAGS</h2>
        <button class="copy" onclick="copyTags()">COPY</button>
      </div>

      <div class="tags" id="tags">
        <span class="tag">#LISAxLVSS27</span>
        <span class="tag">#LISAxLouisVuitton</span>
      </div>

      <div class="actions">
        <button class="shuffle" onclick="generateCaption()">
          🎲 ANOTHER CAPTION
        </button>
        <button class="generate" onclick="copyAll()">
          📋 COPY ALL
        </button>
      </div>

    </section>

  </main>

  <footer class="footer">
    LALISA MANOBAN • FAN-MADE PROJECT
  </footer>

</div>

<script>

const captions = {

glam: [
"{name} is ready to steal the spotlight at {event}. ✨\n\nEvery step, every look, every moment — effortlessly iconic. {name} continues to prove that true star power needs no introduction.",
"{name} brings her undeniable presence to {event}. ✨\n\nFrom the moment she arrives, all eyes are on her. A true fashion icon in the making.",
"All eyes on {name} at {event}. 🖤\n\nEffortless elegance, confidence, and that unmistakable presence — she knows exactly how to own the moment.",
"{name} once again turns a fashion moment into an unforgettable one. ✨\n\nHer style speaks for itself, and her presence says everything.",
"Another fashion moment, another unforgettable appearance from {name}. 🖤\n\nGraceful, confident, and effortlessly captivating."
],

power: [
"{name} has arrived, and the spotlight follows. 🔥\n\nBringing confidence, charisma, and undeniable star power to {event}.",
"{name} owns the moment at {event}. 🔥\n\nA powerful presence, an unforgettable look, and a fashion moment that deserves all the attention.",
"Make way for {name}. 🖤\n\nShe steps into {event} with confidence and leaves a moment nobody will forget.",
"{name} is commanding the spotlight at {event}. ✨\n\nConfidence looks good on her.",
"One arrival. One unforgettable presence. One LISA. 🔥\n\nThe fashion world is watching as {name} steps into {event}."
],

elegant: [
"{name} graces {event} with effortless elegance. ✨\n\nA timeless presence, a refined look, and a moment that speaks for itself.",
"Elegance takes center stage as {name} arrives at {event}. 🖤\n\nEvery detail feels effortlessly beautiful.",
"{name} brings a quiet confidence and timeless elegance to {event}. ✨\n\nSimply unforgettable.",
"Grace, confidence, and effortless style — {name} makes every fashion moment her own.",
"At {event}, {name} proves once again that elegance never goes out of style. ✨"
],

hype: [
"LISA HAS ARRIVED! 🔥🔥\n\nLet’s show {name} all the love and support as she takes over {event}! 🖤",
"THE MOMENT IS HERE! ✨\n\n{name} is at {event}, and we’re ready to celebrate every single fashion moment!",
"Everyone say LISA! 🖤🔥\n\nLet’s give {name} the love she deserves as she shines at {event}!",
"Another iconic moment for {name}! ✨\n\nLet’s make sure her presence at {event} gets all the love and attention!",
"She’s here. She’s shining. She’s LISA. 🔥\n\nLet’s support {name} at {event} and celebrate this incredible fashion moment together!"
],

short: [
"{name} at {event}. Effortlessly iconic. ✨",
"All eyes on {name}. 🖤",
"{name} owns the moment. ✨",
"Simply LISA. Simply unforgettable. 🖤",
"Fashion meets star power. {name} at {event}. ✨",
"{name}. The moment. The icon. 🖤",
"Another unforgettable fashion moment for {name}. ✨"
]

};

const hashtags = "#LISAxLVSS27 #LISAxLouisVuitton";

let currentCaption = "";

function generateCaption(){

  const event =
    document.getElementById("event").value.trim()
    || "Louis Vuitton Fashion Show";

  const name =
    document.getElementById("keyword").value.trim()
    || "LISA";

  const tone =
    document.getElementById("tone").value;

  const list = captions[tone];

  const random =
    list[Math.floor(Math.random() * list.length)];

  currentCaption =
    random
    .replaceAll("{name}", name)
    .replaceAll("{event}", event);

  document.getElementById("caption").textContent =
    currentCaption;

  document.getElementById("result").style.display =
    "block";
}

function copyCaption(){

  navigator.clipboard.writeText(currentCaption)
    .then(()=>{
      alert("Caption berhasil dicopy! ✨");
    })
    .catch(()=>{
      fallbackCopy(currentCaption);
    });
}

function copyTags(){

  navigator.clipboard.writeText(hashtags)
    .then(()=>{
      alert("Hashtag berhasil dicopy!");
    })
    .catch(()=>{
      fallbackCopy(hashtags);
    });
}

function copyAll(){

  const all =
    currentCaption + "\n\n" + hashtags;

  navigator.clipboard.writeText(all)
    .then(()=>{
      alert("Caption + hashtag berhasil dicopy! ✨");
    })
    .catch(()=>{
      fallbackCopy(all);
    });
}

function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");

  textarea.value = text;

  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  textarea.remove();

  alert("Berhasil dicopy! ✨");
}

</script>

</body>
</html>
